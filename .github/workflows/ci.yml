name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python skills/architecture-pro-max/scripts/validate.py
      - run: python tools/generate_adapters.py --check
      - run: python -m unittest discover -s tests -v
